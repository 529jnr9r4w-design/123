<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>道昭通｜相因动态交互界面</title>
<style>
  :root{
    --ink:#6b2a38;
    --paper:#efcfd3;
    --line:rgba(107,42,56,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    overflow:hidden;
  }

  .phone{
    width:100vw;
    height:100vh;
    height:100svh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    overflow:hidden;
  }
  @supports (height:100dvh){.phone{height:100dvh}}

  .poster-wrap{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    display:block;
    overflow:hidden;
    background:var(--paper);
  }

  .poster{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    isolation:isolate;
    background:var(--paper);
  }

  .layer{position:absolute;display:block;pointer-events:none;user-select:none}
  .bg{left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .left-texture{left:0;top:0;width:10%;height:100%;object-fit:fill;opacity:.36;z-index:1}
  .logo{right:2.7%;top:1.1%;width:25.8%;opacity:.86;z-index:3}
  .right-text{right:4.6%;top:16.9%;width:18%;opacity:.96;z-index:3}
  .word{left:0.8%;top:1.4%;width:53.8%;opacity:.98;z-index:3}
  .blob-texture{left:0;top:37.5%;width:100%;height:56.5%;object-fit:fill;opacity:.98;z-index:2}
  .seller{right:0.2%;top:42.6%;width:34.2%;z-index:7;transform-origin:70% 68%;animation:sellerIdle 2.8s ease-in-out infinite}
  .rider{left:2.2%;top:54.4%;width:83.6%;z-index:9;transform-origin:47% 61%;filter:drop-shadow(0 6px 5px rgba(80,35,42,.12));animation:riderEnter 2.1s cubic-bezier(.17,.9,.23,1.03) .2s both, riderRide 3.2s ease-in-out 2.4s infinite}
  .cloud{left:5%;top:76.9%;width:81%;z-index:5;opacity:.98;transform-origin:50% 50%;animation:cloudEnter 2.05s cubic-bezier(.17,.9,.23,1.03) .15s both, cloudFloat 7.2s ease-in-out 2.35s infinite}
  .bottom-text{left:2.2%;bottom:3.1%;width:76%;opacity:.98;z-index:10}

  /* 台词：默认隐藏。点击“讨价还价”后才显示动态。 */
  .speech{
    left:37.8%;
    top:30.7%;
    width:35.8%;
    z-index:8;
    transform-origin:14% 84%;
    filter:drop-shadow(0 2px 3px rgba(80,35,42,.08));
    
    visibility:hidden;
    transform:translate3d(0,8px,0) scale(.96) rotate(-2deg);
  opacity:0;visibility:hidden;transform:translate3d(0,8px,0) scale(.96) rotate(-2deg);}
  .show-speech .speech{
    opacity:1;
    visibility:visible;
    animation:speechBurst .92s cubic-bezier(.2,.8,.2,1.06) 0s 1, speechIdle 3.6s ease-in-out .95s infinite;
  }

  .tap-area{position:absolute;inset:0;z-index:20;background:transparent;border:0;pointer-events:auto;cursor:pointer}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  .controls.two-buttons{grid-template-columns:repeat(2,1fr)}

  .controls{
    flex:none;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:rgba(247,236,238,.98);
    border-top:1px solid var(--line);
    box-shadow:0 -1px 0 rgba(255,255,255,.35) inset;
  }

  /* 默认：三个按钮全部为木牌质感 */
  .btn{
    position:relative;
    appearance:none;
    -webkit-appearance:none;
    border:2px solid rgba(96,50,34,.82);
    border-radius:13px;
    background:linear-gradient(180deg,#ead1ad 0%,#dab487 48%,#c99663 100%);
    color:#592d21;
    padding:15px 10px 16px;
    min-height:56px;
    font-weight:800;
    font-size:14px;
    letter-spacing:.08em;
    line-height:1;
    box-shadow:0 4px 0 rgba(104,52,39,.20),0 11px 18px rgba(80,35,42,.13),inset 0 1px 0 rgba(255,250,236,.58);
    overflow:hidden;
    isolation:isolate;
    text-shadow:0 1px 0 rgba(255,246,224,.42);
    transition:background .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease,transform .12s ease;
  }
  .btn::before{
    content:"";
    position:absolute;
    inset:5px;
    border:1.5px solid rgba(102,55,39,.46);
    border-radius:9px;
    pointer-events:none;
    z-index:2;
  }
  .btn::after{
    content:"";
    position:absolute;
    left:0;right:0;top:0;height:100%;
    background:
      repeating-linear-gradient(92deg,rgba(98,54,38,.10) 0 2px,transparent 2px 15px),
      linear-gradient(90deg,rgba(255,255,255,.13) 0 10%,transparent 10% 42%,rgba(90,46,31,.08) 42% 47%,transparent 47% 74%,rgba(255,255,255,.08) 74% 86%,transparent 86% 100%);
    mix-blend-mode:multiply;
    opacity:.66;
    pointer-events:none;
    z-index:1;
  }
  .btn .tag-holes{
    position:absolute;
    left:13px;
    right:13px;
    top:7px;
    height:7px;
    pointer-events:none;
    z-index:3;
  }
  .btn .tag-holes::before,.btn .tag-holes::after{
    content:"";
    position:absolute;
    top:0;
    width:7px;
    height:7px;
    border-radius:50%;
    background:rgba(82,41,28,.46);
    box-shadow:inset 0 1px 2px rgba(44,20,14,.28),0 1px 0 rgba(255,250,236,.35);
  }
  .btn .tag-holes::before{left:0}
  .btn .tag-holes::after{right:0}
  .btn .btn-label{position:relative;z-index:4}

  /* 悬停/点击：当前按钮才变为深红色印章 */
  .btn:hover,.btn:focus-visible,.btn:active,.btn.is-pressed{
    border-color:rgba(103,41,52,.98);
    background:linear-gradient(180deg,#8c4350 0%,#743541 55%,#5f2a35 100%);
    color:#fff3f0;
    box-shadow:0 4px 0 rgba(70,25,34,.28),0 13px 20px rgba(80,35,42,.22),inset 0 1px 0 rgba(255,255,255,.13);
    text-shadow:none;
  }
  .btn:hover::before,.btn:focus-visible::before,.btn:active::before,.btn.is-pressed::before{
    border-color:rgba(255,231,235,.38);
    box-shadow:inset 0 0 0 1px rgba(80,25,35,.20);
  }
  .btn:hover::after,.btn:focus-visible::after,.btn:active::after,.btn.is-pressed::after{
    background:
      repeating-linear-gradient(92deg,rgba(255,255,255,.045) 0 2px,transparent 2px 14px),
      radial-gradient(circle at 20% 16%,rgba(255,255,255,.14),transparent 32%),
      linear-gradient(90deg,rgba(255,255,255,.05) 0 10%,transparent 10% 40%,rgba(50,17,24,.14) 40% 45%,transparent 45% 72%,rgba(255,255,255,.045) 72% 84%,transparent 84% 100%);
    opacity:.92;
    mix-blend-mode:normal;
  }
  .btn:hover .tag-holes::before,.btn:hover .tag-holes::after,
  .btn:focus-visible .tag-holes::before,.btn:focus-visible .tag-holes::after,
  .btn:active .tag-holes::before,.btn:active .tag-holes::after,
  .btn.is-pressed .tag-holes::before,.btn.is-pressed .tag-holes::after{
    background:rgba(64,24,31,.55);
    box-shadow:inset 0 1px 2px rgba(22,8,12,.30),0 1px 0 rgba(255,235,238,.22);
  }
  .btn:active,.btn.is-pressed{transform:translateY(3px)}

  @keyframes riderEnter{
    0%{transform:translateX(-112%) translateY(10%) rotate(-4.5deg) scale(.96);opacity:0}
    38%{transform:translateX(-14%) translateY(-4%) rotate(2.3deg) scale(1.02);opacity:1}
    60%{transform:translateX(3.2%) translateY(2.4%) rotate(-1.2deg) scale(1)}
    78%{transform:translateX(-1.4%) translateY(-1.2%) rotate(.7deg)}
    100%{transform:translateX(0) translateY(0) rotate(0) scale(1);opacity:1}
  }
  @keyframes cloudEnter{
    0%{transform:translateX(-112%) translateY(8%) scale(.98);opacity:0}
    42%{transform:translateX(-16%) translateY(-2%) scale(1.01);opacity:.94}
    70%{transform:translateX(2.2%) translateY(1.2%) scale(1)}
    100%{transform:translateX(0) translateY(0) scale(1);opacity:.98}
  }
  @keyframes riderRide{
    0%{transform:translate3d(0,0,0) rotate(0deg)}
    18%{transform:translate3d(.4%,-1.2%,0) rotate(-.7deg)}
    38%{transform:translate3d(.7%,-2.1%,0) rotate(-1.1deg)}
    52%{transform:translate3d(.3%,-1.1%,0) rotate(-.35deg)}
    68%{transform:translate3d(-.25%,-.2%,0) rotate(.35deg)}
    84%{transform:translate3d(.15%,-.8%,0) rotate(-.28deg)}
    100%{transform:translate3d(0,0,0) rotate(0deg)}
  }
  @keyframes sellerIdle{
    0%,100%{transform:translateY(0) rotate(0deg)}
    25%{transform:translateY(-.5%) rotate(.5deg)}
    50%{transform:translateY(-1.2%) rotate(1.4deg)}
    75%{transform:translateY(-.4%) rotate(.65deg)}
  }
  @keyframes speechIdle{
    0%,100%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}
    25%{transform:translate3d(.5%,-.9%,0) rotate(-1.2deg) scale(1.012)}
    55%{transform:translate3d(0,-1.5%,0) rotate(.6deg) scale(1.018)}
    80%{transform:translate3d(-.35%,-.5%,0) rotate(-.45deg) scale(1.006)}
  }
  @keyframes cloudFloat{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    22%{transform:translate3d(1.1%,-.6%,0) scale(1.008)}
    48%{transform:translate3d(1.9%,-1.25%,0) scale(1.015)}
    72%{transform:translate3d(.8%,-.45%,0) scale(1.007)}
  }

  .bargain .rider{animation:riderBargain 1.05s cubic-bezier(.35,.02,.2,1) 0s 3!important}
  .bargain .seller{animation:sellerBargain 1.05s ease-in-out 0s 3!important}
  .bargain .cloud{animation:cloudBargain 1.05s ease-in-out 0s 3!important}

  @keyframes riderBargain{
    0%,100%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}
    20%{transform:translate3d(.2%,-1.8%,0) rotate(-.8deg) scale(1.012)}
    45%{transform:translate3d(.65%,-3.8%,0) rotate(-1.7deg) scale(1.026)}
    68%{transform:translate3d(.15%,-1.1%,0) rotate(.45deg) scale(1.01)}
    84%{transform:translate3d(-.2%,.4%,0) rotate(.18deg) scale(.998)}
  }
  @keyframes sellerBargain{
    0%,100%{transform:translateY(0) rotate(0deg)}
    25%{transform:translateY(-1.1%) rotate(1.6deg)}
    55%{transform:translateY(-2.7%) rotate(4deg)}
    78%{transform:translateY(-.8%) rotate(1.2deg)}
  }
  @keyframes cloudBargain{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(3.2%,-1.3%,0) scale(1.03)}
  }
  @keyframes speechBurst{
    0%{transform:translate3d(0,8px,0) rotate(-2.4deg) scale(.82);opacity:0}
    28%{transform:translate3d(.9%,-1.4%,0) rotate(-2.4deg) scale(1.055);opacity:1}
    52%{transform:translate3d(.2%,-2.2%,0) rotate(1.5deg) scale(1.075);opacity:1}
    74%{transform:translate3d(-.5%,-.7%,0) rotate(-1deg) scale(1.03);opacity:1}
    100%{transform:translate3d(0,0,0) rotate(0deg) scale(1);opacity:1}
  }

  @media (max-width:430px){
    .controls{gap:10px;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
    .btn{font-size:13px;padding:13px 6px 14px;min-height:54px}
  }
  @media (max-width:390px){
    .btn{font-size:12px;letter-spacing:.04em}
  }
  @media (max-width:360px){
    .controls{gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
    .btn{font-size:12px;padding:12px 5px 13px;min-height:50px}
    .btn::before{inset:4px}
    .btn .tag-holes{left:11px;right:11px;top:6px}
  }
  @media (min-width:700px){
    body{display:flex;justify-content:center;align-items:flex-start;background:#1a1416}
    .phone{width:430px;height:932px;max-height:100vh;box-shadow:0 24px 60px rgba(0,0,0,.38)}
  }
</style>
</head>
<body>
  <main class="phone">
    <div class="poster-wrap">
      <section class="poster" id="app" aria-label="道昭通 相因 动态交互海报">
        <img class="layer bg" src="assets/bg.png" alt="">
        <img class="layer left-texture" src="assets/left_texture.png" alt="">
        <img class="layer logo" src="assets/logo.png" alt="道昭通标识">
        <img class="layer right-text" src="assets/right_text.png" alt="方言介绍文字">
        <img class="layer word" src="assets/word_xiangyin.png" alt="相因字形与拼音">
        <img class="layer blob-texture" src="assets/blob_texture.png" alt="">
        <img class="layer speech" src="assets/speech.png" alt="讨价还价台词">
        <img class="layer seller" src="assets/seller.png" alt="市集摊主">
        <img class="layer cloud" src="assets/cloud.png" alt="浮云装饰">
        <img class="layer rider" src="assets/rider_deer.png" alt="骑鹿佣主角">
        <img class="layer bottom-text" src="assets/bottom_text.png" alt="相因释义">
        <button class="tap-area" onclick="triggerBargain()" aria-label="点击海报触发讨价还价互动"></button>
        <div id="status" class="sr-only" aria-live="polite"></div>
      </section>
    </div>

    <div class="controls two-buttons" aria-label="交互按钮区">
      <button class="btn" onclick="triggerBargain()"><span class="tag-holes"></span><span class="btn-label">讨价还价</span></button>
      <button class="btn" id="voiceBtn" onclick="playDialect()"><span class="tag-holes"></span><span class="btn-label">方言发音</span></button>
    </div>
  </main>

<script>
const app=document.getElementById('app');
const status=document.getElementById('status');
const buttons=document.querySelectorAll('.btn');

const audio1 = new Audio('assets/audio/bargain_dialogue.mp3');
const audio2 = new Audio('assets/audio/xiangyin_pronunciation.mp3');

function stopAllAudio(){
  [audio1,audio2].forEach((a)=>{
    try{
      a.pause();
      a.currentTime=0;
    }catch(e){}
  });
}

function playAudio(audio, fallbackText){
  stopAllAudio();
  audio.currentTime=0;
  audio.play().catch(()=>{
    status.textContent=fallbackText;
  });
}

buttons.forEach((btn)=>{
  const release=()=>setTimeout(()=>btn.classList.remove('is-pressed'),260);
  btn.addEventListener('pointerdown',()=>btn.classList.add('is-pressed'));
  btn.addEventListener('pointerup',release);
  btn.addEventListener('pointercancel',release);
  btn.addEventListener('pointerleave',release);
  btn.addEventListener('click',()=>{
    btn.classList.add('is-pressed');
    setTimeout(()=>btn.classList.remove('is-pressed'),520);
  });
});

function clearMotionModes(){
  app.classList.remove('bargain');
}

/*
  当前逻辑：
  1. 初始状态：骑鹿佣和浮云从左侧画面外动态入场，台词隐藏。
  2. 点击“讨价还价”：显示台词 PNG 动效，并播放音频1。
  3. 点击“方言发音”：播放“相因”读音音频2，骑鹿佣和台词不消失。
  4. 已删除“重新入场”按钮和对应逻辑。
*/

function triggerBargain(){
  clearMotionModes();
  app.classList.add('show-speech');
  void app.offsetWidth;
  app.classList.add('bargain');
  playAudio(audio1,'请将音频1放入 assets/audio/bargain_dialogue.mp3。');
  status.textContent='显示讨价还价台词，并播放音频1。';
  setTimeout(()=>app.classList.remove('bargain'),3400);
}

function playDialect(){
  playAudio(audio2,'请将音频2放入 assets/audio/xiangyin_pronunciation.mp3。');
  status.textContent='播放“相因”读音音频2。';
}
</script>
</body>
</html>
